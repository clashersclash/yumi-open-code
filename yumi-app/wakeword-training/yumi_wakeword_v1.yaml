# NanoWakeWord training recipe for Yumi.
# This accepts only the wake phrase family below. “hey”, “yummy”, and similar
# words are deliberately negative examples; do NOT add them to the positives.

model_name: "yumi_wakeword_v1"
output_dir: "./trained_models"

positive_data_path: "./data/positive"
negative_data_path: "./data/negative"
background_paths: ["./data/background_noise"]
rir_paths: []

model_type: "dnn"
layer_size: 64
n_blocks: 3
embedding_dim: 128
dropout_prob: 0.3
activation_function: "relu"

margin_pos: 2.0
margin_neg: -2.0
LOSS_BIAS: 0.65
logit_reg_weight: 0.0005
logit_reg_margin: 4.0
logit_min_margin: 1.5

steps: 40000
stabilization_steps: 16000
optimizer_type: "adamw"
learning_rate_max: 0.0008
lr_scheduler_type: "onecycle"
weight_decay: 0.01
momentum: 0.9
num_workers: 0

# Each key here must exist in feature_manifest below.
batch_composition:
  t: 100
  n: 140
  hn: 100

feature_manifest:
  targets:
    t: "./trained_models/yumi_wakeword_v1/features/positive_features.npy"
  negatives:
    n: "./trained_models/yumi_wakeword_v1/features/negative_features.npy"
    hn: "./trained_models/yumi_wakeword_v1/features/hard_negative_features.npy"
  targets_val:
    t_v: "./trained_models/yumi_wakeword_v1/features/positive_features_val.npy"
  negatives_val:
    n_v: "./trained_models/yumi_wakeword_v1/features/negative_features.npy"

# Used by adversarial-negative generation. The positive task adds the two
# permitted greeting variants; everything else stays negative.
target_phrase: "hey yumi"
data_generation_tasks:
  - name: "Positive wake phrases"
    enabled: true
    output_dir: "data/positive"
    num_samples: 4500
    file_prefix: "pos"
    text_source:
      type: "from_list"
      phrases: ["hey yumi", "hello yumi", "hi yumi"]
      repeat_each: 1

  - name: "Positive validation phrases"
    enabled: true
    output_dir: "data/positive_val"
    num_samples: 1500
    file_prefix: "pos_val"
    text_source:
      type: "from_list"
      phrases: ["hey yumi", "hello yumi", "hi yumi"]
      repeat_each: 1

  - name: "Automatic confusable negatives"
    enabled: true
    output_dir: "data/negative"
    num_samples: 6000
    file_prefix: "neg_auto"
    text_source:
      type: "auto_adversarial"
      base_phrase: "hey yumi"
      include_input_words: true
      include_partial_phrase: true
      multi_word_prob: 0.6
      max_multi_word_len: 3

  - name: "Phoneme hard negatives"
    enabled: true
    output_dir: "data/negative_phoneme"
    num_samples: 4000
    file_prefix: "neg_ph"
    text_source:
      type: "phoneme_adversarial"
      base_phrase: "hey yumi"
      min_distance: 0.25

  - name: "Yumi confusable negatives"
    enabled: true
    output_dir: "data/negative"
    num_samples: 2400
    file_prefix: "neg_custom"
    text_source:
      type: "from_list"
      phrases:
        - "hey"
        - "hello"
        - "hi"
        - "yumi"
        - "yummy"
        - "you me"
        - "hey you"
        - "hello you"
        - "hey siri"
        - "hey google"
        - "hey umi"
        - "hey yummi"
        - "human"
        - "you"
      repeat_each: 1

augmentation_batch_size: 16
feature_gen_cpu_ratio: 1.0
augmentation_settings:
  gain_prob: 1.0
  min_gain_in_db: -3.0
  max_gain_in_db: 3.0
  pitch_prob: 0.35
  min_pitch_semitones: -1.0
  max_pitch_semitones: 1.0
  min_snr_in_db: 12.0
  max_snr_in_db: 35.0
  rir_prob: 0.0

feature_generation_manifest:
  positives:
    input_audio_dirs: ["./data/positive"]
    output_filename: "positive_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 8
  positives_validation:
    input_audio_dirs: ["./data/positive_val"]
    output_filename: "positive_features_val.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 4
  negatives:
    input_audio_dirs: ["./data/negative"]
    output_filename: "negative_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 6
  hard_negatives:
    input_audio_dirs: ["./data/negative_phoneme"]
    output_filename: "hard_negative_features.npy"
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 2

validation_batch_size: 256
validation_smoothing_window: 3
val_miss_weight: 4.0
val_fp_weight: 2.0
val_early_stopping_patience: 6000
checkpointing:
  enabled: true
  interval_steps: 1000
  limit: 3

onnx_opset_version: 17
show_training_summary: true
debug_mode: false

# First run only. Set both generation flags false for later train-only runs.
generate_clips: true
transform_clips: true
train_model: true
overwrite: false
